services:
  - type: web
    name: shopify-reactivation-service
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: AIRTABLE_API_KEY
        sync: false
      - key: AIRTABLE_BASE_ID
        sync: false
      - key: AIRTABLE_TABLE
        sync: false
      - key: AIRTABLE_BATCH_SIZE
        value: 10
      - key: AIRTABLE_REQUEST_TIMEOUT_MS
        value: 30000
      - key: AIRTABLE_MAX_RETRIES
        value: 3
      - key: DOWNLOAD_TIMEOUT_MS
        value: 300000
      - key: LOG_LEVEL
        value: info
      - key: PROGRESS_INTERVAL
        value: 10000
    autoDeploy: true
